<nav [attr.aria-label]="'sidenav.sections' | translate">
  <app-section-card
    icon="notes"
    [label]="'sidenav.allNotes' | translate"
    [active]="!sectionsService.currentSectionSelected()?.id"
    (selectClick)="selectSection(null)"
  />

  @for (section of sectionsService.sections(); track section.id) {
    <app-section-card
      icon="folder_open"
      [label]="sectionsService.displaySectionName(section)"
      [section]="section"
      [active]="section.id === sectionsService.currentSectionSelected()?.id"
      (selectClick)="selectSection(section.id!)"
      (editClick)="openUpsertSectionModal($event)"
      (deleteClick)="deleteSection($event)"
    />
  }

  <button
    class="new-section-btn"
    (click)="openUpsertSectionModal()"
    [attr.aria-label]="'sidenav.newSection' | translate"
  >
    <mat-icon>add</mat-icon>
    <span>{{ 'sidenav.newSection' | translate }}</span>
  </button>
</nav>
