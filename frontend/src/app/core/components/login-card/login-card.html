<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ 'login.title' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'login.subtitle' | translate }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="login-description">{{ 'login.description' | translate }}</p>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'login.nameLabel' | translate }}</mat-label>
        <input matInput [(ngModel)]="name" [disabled]="loading()" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'login.emailLabel' | translate }}</mat-label>
        <input matInput type="email" [(ngModel)]="email" [disabled]="loading()" />
      </mat-form-field>

      @if (errorText()) {
        <p class="login-error">{{ errorText() }}</p>
      }
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button (click)="signIn()" [disabled]="loading() || !name.trim()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        }
        @if (!loading()) {
          <mat-icon>login</mat-icon>
        }
        @if (!loading()) {
          {{ 'login.continue' | translate }}
        }
      </button>
    </mat-card-actions>
  </mat-card>
</div>
